<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer Game - WASM</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      canvas#viewport {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport" width="800" height="600"></canvas>
    <script type="module">
      try {
        const { default: init } = await import("./pkg/game_web.js");
        await init();
      } catch (error) {
        alert("An error occurred while loading the game.");
        console.error("Error loading WASM module:", error);
      }
    </script>
  </body>
</html>
