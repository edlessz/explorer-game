[package]
name = "game-web"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
] }

[lib]
crate-type = ["cdylib", "rlib"]
