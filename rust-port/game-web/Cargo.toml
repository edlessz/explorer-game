[package]
name = "game-web"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
    "KeyboardEvent",
    "MouseEvent",
    "EventTarget",
    "AddEventListenerOptions",
    "console",
] }

[lib]
crate-type = ["cdylib", "rlib"]
